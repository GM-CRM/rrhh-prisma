<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo con gradiente prisma -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="prisma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Figura de persona (RH) -->
  <circle cx="256" cy="170" r="68" fill="url(#prisma)"/>
  <path d="M128 390c0-70 57-128 128-128s128 58 128 128" fill="url(#prisma)"/>
  <!-- Prisma / diamante decorativo -->
  <polygon points="390,120 430,175 390,230 350,175" fill="white" opacity="0.25"/>
  <polygon points="390,120 430,175 390,175" fill="white" opacity="0.4"/>
  <!-- Líneas decorativas -->
  <line x1="90" y1="390" x2="160" y2="390" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="90" y1="415" x2="135" y2="415" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
</svg>
