<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Encuesta — RRHH Prisma</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1b3e">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0d1b3e; --ink2:#1e2d52; --violet:#7c3aed; --violet2:#a855f7;
  --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e;
  --surface:#f4f3ff; --white:#fff; --r:16px;
}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;overflow-x:hidden;}

/* Fondo animado */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 5% 0%,rgba(124,58,237,.1) 0%,transparent 60%),
    radial-gradient(ellipse 50% 70% at 95% 100%,rgba(168,85,247,.08) 0%,transparent 60%);
}

/* Header */
.hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(13,27,62,.97);backdrop-filter:blur(16px);
  padding:10px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 20px rgba(0,0,0,.3);
}
.hdr-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.hdr-brand img{width:30px;height:30px;border-radius:7px;}
.hdr-brand span{font-size:.82rem;font-weight:800;color:#fff;letter-spacing:.02em;}
.hdr-brand em{color:#a78bfa;font-style:normal;}

/* Barra progreso header */
.prog-wrap{flex:1;max-width:320px;}
.prog-labels{display:flex;justify-content:space-between;margin-bottom:4px;}
.prog-labels span{font-size:.65rem;color:rgba(255,255,255,.5);}
.prog-labels strong{font-size:.65rem;color:#a78bfa;font-weight:700;}
.prog-bg{background:rgba(255,255,255,.1);border-radius:99px;height:5px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#7c3aed,#a855f7,#f59e0b,#10b981,#a855f7,#7c3aed);
  background-size:300% 100%;
  animation:shimmer 2s linear infinite;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
@keyframes shimmer{0%{background-position:300% 0;}100%{background-position:-300% 0;}}

/* Contenedor */
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:28px 14px 90px;}

/* Pantalla ID */
.id-card{
  background:var(--white);border-radius:24px;
  box-shadow:0 8px 40px rgba(124,58,237,.12);
  padding:36px 28px;text-align:center;
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.id-logo{
  width:80px;height:80px;border-radius:20px;margin:0 auto 16px;
  box-shadow:0 8px 32px rgba(124,58,237,.35);
  display:block;
}
.id-card h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:6px;line-height:1.2;}
.id-card p{font-size:.88rem;color:#64748b;line-height:1.5;margin-bottom:24px;}

.field-group{display:grid;gap:14px;text-align:left;margin-bottom:22px;}
.field-group label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#64748b;display:block;margin-bottom:5px;}
.field-group input{
  width:100%;border:2px solid #e2e8f0;border-radius:12px;
  padding:13px 16px;font-size:.95rem;color:var(--ink);
  background:#fafafa;transition:border-color .2s,background .2s;
  font-family:inherit;
}
.field-group input:focus{outline:none;border-color:var(--violet);background:var(--white);}

/* Info precargado */
.preloaded-badge{
  background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(168,85,247,.05));
  border:1.5px solid rgba(124,58,237,.2);border-radius:12px;
  padding:12px 16px;text-align:left;
}
.preloaded-badge p.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);margin-bottom:2px;}
.preloaded-badge p.val{font-size:.9rem;font-weight:700;color:var(--ink);}
.preloaded-badge p.hint{font-size:.75rem;color:#64748b;margin-top:3px;}

/* Error box */
.err-box{
  display:none;background:#fef2f2;border:1.5px solid #fecaca;
  border-radius:10px;padding:10px 14px;margin-bottom:14px;
  font-size:.82rem;color:#b91c1c;text-align:left;
  align-items:center;gap:8px;
}
.err-box.show{display:flex;}

/* Btn primary */
.btn-pry{
  width:100%;background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;font-weight:700;font-size:.95rem;border:none;border-radius:12px;
  padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(124,58,237,.3);transition:transform .15s,box-shadow .15s;
}
.btn-pry:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(124,58,237,.4);}
.btn-pry:active{transform:scale(.98);}
.btn-pry:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* Bloque */
.block-hdr{display:flex;align-items:center;gap:11px;margin:32px 0 16px;animation:fadeUp .4s ease both;}
.block-num{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(124,58,237,.3);
}
.block-name{font-size:1rem;font-weight:800;color:var(--ink);}

/* Tarjeta pregunta */
.q-card{
  background:var(--white);border-radius:14px;padding:20px;margin-bottom:10px;
  border:1.5px solid #ede9ff;box-shadow:0 2px 10px rgba(124,58,237,.05);
  transition:border-color .2s,box-shadow .2s;animation:fadeUp .35s ease both;
}
.q-card:hover{border-color:rgba(124,58,237,.25);box-shadow:0 4px 18px rgba(124,58,237,.1);}
.q-card.answered{border-color:rgba(16,185,129,.3);background:linear-gradient(135deg,#fff,#f0fdf4);}

.q-num{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);margin-bottom:7px;}
.q-text{font-size:.93rem;font-weight:600;color:var(--ink);line-height:1.55;margin-bottom:14px;}
.open-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(245,158,11,.1);color:#b45309;
  font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  border-radius:99px;padding:2px 8px;margin-bottom:7px;
}

/* Escala */
.scale-row{display:flex;gap:7px;flex-wrap:wrap;}
.sc-opt{flex:1;min-width:54px;cursor:pointer;}
.sc-opt input{display:none;}
.sc-opt label{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px;border-radius:11px;border:2px solid #e2e8f0;
  cursor:pointer;background:#fafafa;transition:all .2s;
}
.sc-opt label .n{font-size:1.15rem;font-weight:800;color:#94a3b8;transition:color .2s;}
.sc-opt label .l{font-size:.58rem;text-align:center;color:#94a3b8;line-height:1.2;transition:color .2s;}
.sc-opt input:checked+label{transform:translateY(-2px);box-shadow:0 4px 12px rgba(124,58,237,.2);}
.sc-opt[data-v="0"] input:checked+label{border-color:#dc2626;background:rgba(220,38,38,.06);}
.sc-opt[data-v="0"] input:checked+label .n{color:#dc2626;}
.sc-opt[data-v="1"] input:checked+label{border-color:#ef4444;background:rgba(239,68,68,.06);}
.sc-opt[data-v="1"] input:checked+label .n{color:#ef4444;}
.sc-opt[data-v="2"] input:checked+label{border-color:#f97316;background:rgba(249,115,22,.06);}
.sc-opt[data-v="2"] input:checked+label .n{color:#f97316;}
.sc-opt[data-v="3"] input:checked+label{border-color:#f59e0b;background:rgba(245,158,11,.06);}
.sc-opt[data-v="3"] input:checked+label .n{color:#f59e0b;}
.sc-opt[data-v="4"] input:checked+label{border-color:#22c55e;background:rgba(34,197,94,.06);}
.sc-opt[data-v="4"] input:checked+label .n{color:#22c55e;}
.sc-opt[data-v="5"] input:checked+label{border-color:#10b981;background:rgba(16,185,129,.06);}
.sc-opt[data-v="5"] input:checked+label .n{color:#10b981;}

/* Múltiple */
.multi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.multi-opt{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  border:2px solid #e2e8f0;border-radius:10px;background:#fafafa;
  cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s;
}
.multi-opt input{display:none;}
.chk{
  width:18px;height:18px;border-radius:5px;border:2px solid #cbd5e1;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.68rem;transition:all .2s;
}
.multi-opt.sel{border-color:var(--violet);background:rgba(124,58,237,.06);}
.multi-opt.sel .chk{background:var(--violet);border-color:var(--violet);color:#fff;}

/* Abierta */
.open-ta{
  width:100%;border:2px solid #e2e8f0;border-radius:11px;
  padding:11px 14px;font-size:.9rem;color:var(--ink);
  resize:vertical;min-height:90px;font-family:inherit;
  background:#fafafa;transition:border-color .2s;line-height:1.5;
}
.open-ta:focus{outline:none;border-color:var(--violet);background:var(--white);}

/* Footer */
.survey-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid #ede9ff;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.footer-info{font-size:.78rem;color:#64748b;}
.footer-info strong{color:var(--violet);font-weight:700;}
.btn-send{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;font-weight:700;font-size:.88rem;border:none;
  border-radius:11px;padding:11px 26px;cursor:pointer;
  box-shadow:0 4px 14px rgba(124,58,237,.3);transition:transform .15s,box-shadow .15s;white-space:nowrap;
}
.btn-send:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(124,58,237,.4);}
.btn-send:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* Éxito */
.success-screen{
  display:none;text-align:center;padding:56px 28px;
  background:var(--white);border-radius:24px;
  box-shadow:0 8px 40px rgba(124,58,237,.12);
  animation:fadeUp .5s ease both;
}
.success-icon{
  width:80px;height:80px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#fff;
  box-shadow:0 8px 24px rgba(16,185,129,.3);
  animation:popIn .5s cubic-bezier(.4,0,.2,1) .2s both;
}
@keyframes popIn{from{transform:scale(0);}to{transform:scale(1);}}
.success-screen h2{font-size:1.6rem;font-weight:800;color:var(--ink);margin-bottom:10px;}
.success-screen p{font-size:.92rem;color:#64748b;line-height:1.6;}

/* Responsive */
@media(max-width:480px){
  .wrap{padding:16px 10px 88px;}
  .id-card{padding:26px 18px;}
  .scale-row{gap:5px;}
  .sc-opt label{padding:8px 3px;}
  .sc-opt label .n{font-size:1rem;}
  .sc-opt label .l{font-size:.55rem;}
  .multi-grid{grid-template-columns:1fr;}
  .prog-wrap{display:none;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <img src="icon.png" alt="Prisma">
    <span>RRHH <em>Prisma</em></span>
  </div>
  <div class="prog-wrap" id="prog-wrap" style="display:none">
    <div class="prog-labels">
      <span id="prog-label">0 de 0</span>
      <strong id="prog-pct">0%</strong>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</header>

<!-- CONTENIDO -->
<div class="wrap" id="wrap">

  <!-- PANTALLA 1: Identificación -->
  <div id="id-screen" class="id-card">
    <img src="icon.png" class="id-logo" alt="Logo">
    <h1 id="enc-titulo">Cargando...</h1>
    <p id="enc-desc">Por favor espera un momento.</p>

    <div class="err-box" id="err-box">
      <i class="fas fa-exclamation-circle"></i>
      <span id="err-msg"></span>
    </div>

    <!-- Campos modo general -->
    <div class="field-group" id="campos-generales">
      <div>
        <label>Número de empleado</label>
        <input type="text" id="inp-noemp" inputmode="numeric" placeholder="Ej. 218"
          onkeydown="if(event.key==='Enter')document.getElementById('inp-nombre').focus()">
      </div>
      <div>
        <label>Nombre completo</label>
        <input type="text" id="inp-nombre" placeholder="Apellidos y Nombre(s)"
          onkeydown="if(event.key==='Enter')iniciarEncuesta()">
      </div>
    </div>

    <!-- Info precargada (modo baja) -->
    <div class="preloaded-badge" id="precargado-box" style="display:none;margin-bottom:16px;">
      <p class="tag"><i class="fas fa-user-check" style="margin-right:4px;"></i>Empleado identificado</p>
      <p class="val" id="precargado-val">—</p>
      <p class="hint">Solo confirma tu nombre completo para continuar.</p>
    </div>
    <div class="field-group" id="campo-nombre-solo" style="display:none;margin-bottom:16px;">
      <div>
        <label>Confirma tu nombre completo</label>
        <input type="text" id="inp-nombre-solo" placeholder="Apellidos y Nombre(s)"
          onkeydown="if(event.key==='Enter')iniciarEncuesta()">
      </div>
    </div>

    <button class="btn-pry" id="btn-iniciar" onclick="iniciarEncuesta()">
      <i class="fas fa-play"></i> Comenzar encuesta
    </button>
  </div>

  <!-- PANTALLA 2: Preguntas -->
  <div id="q-screen" style="display:none;"></div>

  <!-- PANTALLA 3: Éxito -->
  <div class="success-screen" id="ok-screen">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <h2>¡Muchas gracias!</h2>
    <p>Tus respuestas han sido registradas.<br>Tu opinión contribuye a mejorar nuestra organización.</p>
  </div>
</div>

<!-- FOOTER -->
<div class="survey-footer" id="survey-footer" style="display:none">
  <div class="footer-info">
    Respondidas: <strong id="ft-resp">0</strong> de <strong id="ft-total">0</strong>
  </div>
  <button class="btn-send" id="btn-enviar" onclick="enviarEncuesta()">
    <i class="fas fa-paper-plane"></i> Enviar
  </button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzZ1izlOXEasq80AVLH6BiYhXSvTVwDytEFqLJ-TWfFlXlnw2Kf6zNqy0Us2jFEHo4YcQ/exec";
const params       = new URLSearchParams(location.search);
const encId        = (params.get('enc') || 'SALIDA').toUpperCase();
const preIdInterno = params.get('idInterno') || '';
const modoPrec     = !!preIdInterno;

let encuestaData    = null;
let empleadoId      = '';
let empleadoNombre  = '';
let empleadoEmpresa = '';

let ESCALA = [
  {v:1,l:'Totalmente\nen desacuerdo'},
  {v:2,l:'En\ndesacuerdo'},
  {v:3,l:'Ni de acuerdo\nni en desacuerdo'},
  {v:4,l:'De\nacuerdo'},
  {v:5,l:'Totalmente\nde acuerdo'},
];

const ESCALA_CLIMA = [
  {v:1,l:'Total\\ndesacuerdo'},
  {v:2,l:'En\\ndesacuerdo'},
  {v:3,l:'Neutral'},
  {v:4,l:'De\\nacuerdo'},
  {v:5,l:'Muy de\\nacuerdo'},
];

function mostrarError(msg){
  const b=document.getElementById('err-box');
  const m=document.getElementById('err-msg');
  if(b){b.classList.add('show');}
  if(m) m.textContent=msg;
}
function ocultarError(){
  const b=document.getElementById('err-box');
  if(b) b.classList.remove('show');
}

async function cargarEncuesta(){
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'obtener_encuesta',payload:{encId}})});
    const d=await r.json();
    if(d.status==='success'){
      encuestaData=d.encuesta;
      document.getElementById('enc-titulo').textContent=encuestaData.titulo;
      document.getElementById('enc-desc').textContent=encuestaData.descripcion||'Responde con honestidad. Es confidencial.';
      // Ajustar escala según el tipo de encuesta
      if(encId==='CLIMA') ESCALA=ESCALA_CLIMA;
      else if(encuestaData.escala&&encuestaData.escala.length===5){
        ESCALA=encuestaData.escala.map(function(e){return{v:e.valor,l:e.etiqueta};});
      }
    } else { encuestaData=ENCUESTA_SALIDA; setTituloFallback(); }
  }catch(e){ encuestaData=ENCUESTA_SALIDA; setTituloFallback(); }

  if(modoPrec){
    document.getElementById('campos-generales').style.display='none';
    document.getElementById('precargado-box').style.display='block';
    document.getElementById('campo-nombre-solo').style.display='block';
    try{
      const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'obtener_empleado_por_id',payload:{idInterno:preIdInterno}})});
      const d=await r.json();
      if(d.status==='success'&&d.empleado){
        const e=d.empleado;
        empleadoId=preIdInterno; empleadoEmpresa=e.empresa||'';
        document.getElementById('precargado-val').textContent='#'+e.noEmpleado+' · '+e.empresa;
        document.getElementById('inp-nombre-solo').value=e.nombre||'';
      } else {
        empleadoId=preIdInterno;
        document.getElementById('precargado-val').textContent='ID: '+preIdInterno;
      }
    }catch(e){ empleadoId=preIdInterno; document.getElementById('precargado-val').textContent='ID: '+preIdInterno; }
  }
}

function setTituloFallback(){
  document.getElementById('enc-titulo').textContent=encuestaData.titulo;
  document.getElementById('enc-desc').textContent=encuestaData.descripcion;
}

async function iniciarEncuesta(){
  ocultarError();
  const btn=document.getElementById('btn-iniciar');
  let nombre='';

  if(modoPrec){
    nombre=(document.getElementById('inp-nombre-solo').value||'').trim();
    if(!nombre){mostrarError('Por favor confirma tu nombre completo.');return;}
    empleadoNombre=nombre;
  } else {
    const noemp=(document.getElementById('inp-noemp').value||'').trim();
    nombre=(document.getElementById('inp-nombre').value||'').trim();
    if(!noemp){mostrarError('Ingresa tu número de empleado.');return;}
    if(!nombre){mostrarError('Ingresa tu nombre completo.');return;}
    empleadoNombre=nombre;

    // Buscar ID INTERNO por número + nombre
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Verificando...';
    try{
      const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({
        action:'buscar_empleado_encuesta',payload:{noEmpleado:noemp,nombre:nombre}
      })});
      const d=await r.json();
      btn.disabled=false; btn.innerHTML='<i class="fas fa-play"></i> Comenzar encuesta';
      if(d.status==='success'||d.status==='warning'){
        empleadoId=d.empleado.idInterno||noemp;
        empleadoEmpresa=d.empleado.empresa||'';
        if(d.status==='warning') mostrarError(d.message+' Continuando de todas formas.');
      } else {
        mostrarError(d.message||'No se encontró tu registro. Verifica tus datos.');
        return;
      }
    }catch(e){
      btn.disabled=false; btn.innerHTML='<i class="fas fa-play"></i> Comenzar encuesta';
      empleadoId=noemp; // fallback
    }
  }

  // ── NOM-035: asignación dinámica de cuestionario (Guía I / Guía II) ──
  // Mismo link público para todos — aquí se decide, según cuántos activos
  // tiene la RAZÓN SOCIAL (empresa) del empleado (no el Grupo Comercial),
  // qué cuestionario mostrar: <50 activos → Guía I, >=50 → Guía II.
  if (encId === 'NOM035') {
    if (!empleadoId) {
      mostrarError('No se pudo identificar tu empresa para asignar el cuestionario correcto. Verifica tu número de empleado.');
      return;
    }
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparando cuestionario...';
    try {
      const rNom = await fetch(API_URL, { method:'POST', body: JSON.stringify({
        action: 'obtener_estructura_nom035', payload: { idInterno: empleadoId }
      })});
      const dNom = await rNom.json();
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Comenzar encuesta';
      if (dNom.status === 'success') {
        window._nom035Tipo = dNom.tipoCuestionario; // 'guia1' | 'guia2' — se manda al guardar la respuesta
        encuestaData = dNom.encuesta;
        document.getElementById('enc-titulo').textContent = encuestaData.titulo;
        document.getElementById('enc-desc').textContent = encuestaData.descripcion || '';
        // Escala propia NOM-035: 0-4 (Nunca...Siempre), no la de 1-5 genérica
        if (encuestaData.escala && encuestaData.escala.length === 5) {
          ESCALA = encuestaData.escala.map(function(e){ return { v: e.valor, l: e.etiqueta }; });
        }
      } else {
        mostrarError(dNom.message || 'No se pudo determinar el cuestionario correspondiente.');
        return;
      }
    } catch(e) {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Comenzar encuesta';
      mostrarError('Error de conexión al preparar el cuestionario. Intenta de nuevo.');
      return;
    }
  }

  document.getElementById('id-screen').style.display='none';
  document.getElementById('q-screen').style.display='block';
  document.getElementById('survey-footer').style.display='flex';
  document.getElementById('prog-wrap').style.display='block';
  renderPreguntas();
  actualizarProgreso();
  window.scrollTo(0,0);
}

function renderPreguntas(){
  if(!encuestaData) return;
  let html=''; let gq=0;
  encuestaData.bloques.forEach(function(bloque,bi){
    html+=`<div class="block-hdr" style="animation-delay:${bi*.04}s">
      <div class="block-num">${bloque.icono||(bi+1)}</div>
      <div class="block-name">${bloque.titulo}</div>
    </div>`;
    (bloque.preguntas||[]).forEach(function(preg,pi){
      gq++;
      const delay=(bi*5+pi)*.025;
      html+=`<div class="q-card" id="qc-${gq}" style="animation-delay:${delay}s">`;
      html+=`<div class="q-num">Pregunta ${gq}</div>`;
      if(preg.tipo==='abierta') html+=`<div class="open-tag"><i class="fas fa-pen-line"></i> Respuesta abierta</div>`;
      html+=`<div class="q-text">${preg.texto}</div>`;
      if(preg.tipo==='escala'){
        html+='<div class="scale-row">';
        ESCALA.forEach(function(e){
          html+=`<div class="sc-opt" data-v="${e.v}">
            <input type="radio" name="q${gq}" id="q${gq}_${e.v}" value="${e.v}" onchange="onResp(${gq})">
            <label for="q${gq}_${e.v}">
              <span class="n">${e.v}</span>
              <span class="l">${e.l.replace('\n','<br>')}</span>
            </label></div>`;
        });
        html+='</div>';
      } else if(preg.tipo==='multiple'){
        html+='<div class="multi-grid">';
        (preg.opciones||[]).forEach(function(op,oi){
          html+=`<label class="multi-opt" id="mo-${gq}-${oi}" onclick="toggleMulti(${gq},${oi},this)">
            <input type="checkbox" name="q${gq}" value="${op}">
            <span class="chk" id="chk-${gq}-${oi}"><i class="fas fa-check" style="display:none"></i></span>
            ${op}</label>`;
        });
        html+='</div>';
      } else {
        html+=`<textarea class="open-ta" id="qa-${gq}" placeholder="Escribe tu respuesta..." oninput="onResp(${gq})" rows="3"></textarea>`;
      }
      html+='</div>';
    });
  });
  document.getElementById('q-screen').innerHTML=html;
  document.getElementById('ft-total').textContent=gq;
}

function onResp(qn){
  const c=document.getElementById('qc-'+qn);
  if(c) c.classList.add('answered');
  actualizarProgreso();
}

function toggleMulti(qn,oi,lbl){
  const inp=lbl.querySelector('input');
  inp.checked=!inp.checked;
  lbl.classList.toggle('sel',inp.checked);
  const ico=document.getElementById('chk-'+qn+'-'+oi)?.querySelector('i');
  if(ico) ico.style.display=inp.checked?'block':'none';
  onResp(qn);
}

function actualizarProgreso(){
  const cards=document.querySelectorAll('.q-card');
  let resp=0;
  cards.forEach(function(c,i){
    const n=i+1;
    const radios=document.querySelectorAll(`input[name="q${n}"]:checked`);
    const ta=document.getElementById('qa-'+n);
    if(radios.length>0||(ta&&ta.value.trim())) resp++;
  });
  const total=cards.length;
  const pct=total>0?Math.round(resp/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=resp+' de '+total;
  document.getElementById('ft-resp').textContent=resp;
}

function recopilarRespuestas(){
  const cards=document.querySelectorAll('.q-card');
  const resp={};
  cards.forEach(function(c,i){
    const n=i+1;
    const radios=document.querySelectorAll(`input[type="radio"][name="q${n}"]:checked`);
    const checks=document.querySelectorAll(`input[type="checkbox"][name="q${n}"]:checked`);
    const ta=document.getElementById('qa-'+n);
    if(radios.length>0) resp['q'+n]=radios[0].value;
    else if(checks.length>0) resp['q'+n]=Array.from(checks).map(function(c){return c.value;});
    else if(ta&&ta.value.trim()) resp['q'+n]=ta.value.trim();
  });
  return resp;
}

async function enviarEncuesta(){
  const respuestas=recopilarRespuestas();
  if (encId === 'NOM035' && window._nom035Tipo) respuestas._guia = window._nom035Tipo;
  const total=document.querySelectorAll('.q-card').length;
  const resp=Object.keys(respuestas).length;
  if(resp<Math.ceil(total*.7)){
    if(!confirm(`Has respondido ${resp} de ${total} preguntas. ¿Enviar de todas formas?`)) return;
  }
  const btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Enviando...';
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({
      action:'guardar_respuesta',
      payload:{encId,empleadoId,empleadoNombre,empleadoEmpresa,respuestas,fechaRespuesta:new Date().toISOString()}
    })});
    const d=await r.json();
    if(d.status==='success'){
      document.getElementById('q-screen').style.display='none';
      document.getElementById('survey-footer').style.display='none';
      document.getElementById('prog-wrap').style.display='none';
      document.getElementById('ok-screen').style.display='block';
      window.scrollTo(0,0);
    } else {
      alert('Error: '+(d.message||'Intenta de nuevo.'));
      btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> Enviar';
    }
  }catch(e){
    alert('Error de conexión. Verifica tu internet.');
    btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> Enviar';
  }
}
